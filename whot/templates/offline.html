{% extends "base.html" %} {% block title %}Offline | whot_io{% endblock %} {%
block bodyclass %}home{% endblock %} {% block body %}
<main class="home-wrap">
  <header class="hero">
    <span class="logo logo-lg">WHOT<span>_</span>IO</span>
  </header>
  <section class="panel center" style="margin-top: 32px">
    <h2
      style="
        font-family: var(--display);
        font-weight: 400;
        font-size: 1.6rem;
        color: var(--primary);
      "
    >
      You're offline
    </h2>
    <p class="muted">
      whot_io needs the internet to connect you to other players. Check your
      data or Wi-Fi, then try again.
    </p>
    <button class="btn btn-block" onclick="location.reload()">Try again</button>
  </section>
</main>
{% endblock %}
